<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Gallery</h1>
    <nav class="filters" id="filters" aria-label="Filter images">
      <button class="active" data-filter="all">All</button>
      <button data-filter="nature">Nature</button>
      <button data-filter="animals">Animals</button>
      <button data-filter="city">City</button>
    </nav>
  </header>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-btn close" id="close" aria-label="Close">&times;</button>
    <button class="lb-btn prev" id="prev" aria-label="Previous image">&#10094;</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn next" id="next" aria-label="Next image">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
